# Disable the GTCEu buildscript's configuration-time "is a newer build.gradle available?"
# check (build.gradle guards it with Boolean.getBoolean('DISABLE_BUILDSCRIPT_UPDATE_CHECK')).
#
# The check prints "Build script update available! Run 'gradle updateBuildScript'" to stdout
# during project evaluation, including under `gradlew -q`. The release workflow captures
# `gradlew -q printModName` and friends straight into GITHUB_ENV, so a stray banner would be
# concatenated into MOD_NAME / MOD_VERSION / MOD_ARCHIVE_BASE_NAME and break the publish step.
# The check also fetches raw.githubusercontent.com at configuration time, which can hard-fail
# CI on a socket timeout.
#
# We don't want the auto-update anyway. build.gradle is not pristine upstream: it pins
# RetroFuturaGradle at 1.4.7 and carries a NOTE above the lwjgl3ify dependency. Do not run
# `gradle updateBuildScript` to refresh it, because that overwrites both edits. Three-way merge
# instead (the procedure is in the sibling LDIB repo's gradle.properties).
systemProp.DISABLE_BUILDSCRIPT_UPDATE_CHECK = true

# Effectively applies the '--stacktrace' flag by default
org.gradle.logging.stacktrace = all

# Decompilation and the RFG asset pipeline are memory-hungry. 3G matches the other
# Mica Technologies 1.12.2 mods and is what CI is sized for.
org.gradle.jvmargs = -Xmx3G
